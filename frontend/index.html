<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for History & Progress -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Learning Progress</h2>
                <button id="new-chat-btn" class="icon-btn" title="New Topic">
                    <span class="material-icons-outlined">add</span>
                </button>
            </div>
            <div class="progress-container">
                <ul id="progress-list" class="progress-list">
                    <!-- Progress items dynamically loaded here -->
                </ul>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="chat-header" style="justify-content: space-between;">
                <div>
                    <h1>Learning Companion <span class="badge">Pro</span></h1>
                </div>
                <select id="language-select" style="background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; outline: none;">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi (हिंदी)</option>
                    <option value="Spanish">Spanish (Español)</option>
                    <option value="French">French (Français)</option>
                    <option value="Marathi">Marathi (मराठी)</option>
                </select>
            </header>

            <div class="chat-box" id="chat-box">
                <div class="welcome-screen" id="welcome-screen">
                    <span class="material-icons-outlined spark-icon">auto_awesome</span>
                    <h2>Hello! What do you want to learn today?</h2>
                    <p>I will adapt the lesson to your current level.</p>
                </div>
                <!-- Chat messages will be injected here -->
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <form id="chat-form" class="chat-form">
                    <input 
                        type="text" 
                        id="topic-input" 
                        class="chat-input" 
                        placeholder="Enter a topic (e.g. Quantum Computing, Javascript...)" 
                        required 
                        autocomplete="off"
                    >
                    <button type="submit" class="send-btn" id="send-btn">
                        <span class="material-icons-outlined">send</span>
                    </button>
                </form>
                <div class="footer-text">AI can make mistakes. Consider verifying important information.</div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
