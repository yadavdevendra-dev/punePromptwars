steps:
  # Step 1: Run unit tests before building
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd backend && npm install && npm test'
    env:
      - 'NODE_ENV=test'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/learning-companion:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/learning-companion:latest'
      - '.'

  # Step 3: Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/learning-companion:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/learning-companion:latest']

  # Step 4: Deploy to Cloud Run with Secret Manager + Firestore
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'learning-companion'
      - '--image'
      - 'gcr.io/$PROJECT_ID/learning-companion:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/learning-companion:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/learning-companion:latest'

options:
  logging: CLOUD_LOGGING_ONLY
